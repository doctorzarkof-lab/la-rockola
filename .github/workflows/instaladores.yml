name: Construir instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  construir:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar y crear el .jar
        shell: bash
        run: |
          mkdir -p out entrada/lib instalador portable
          javac --release 17 -encoding UTF-8 -cp lib/jlayer-1.0.1.jar -d out $(find estilo componentes -name '*.java') *.java
          printf "Main-Class: VentanaPrincipal\nClass-Path: lib/jlayer-1.0.1.jar\n" > manifest.txt
          jar cfm entrada/LaRockola.jar manifest.txt -C out .
          cp lib/jlayer-1.0.1.jar entrada/lib/

      - name: Icono para Mac
        if: runner.os == 'macOS'
        run: |
          mkdir LaRockola.iconset
          for s in 16 32 128 256; do
            sips -z $s $s recursos/LaRockola.png --out LaRockola.iconset/icon_${s}x${s}.png
          done
          iconutil -c icns LaRockola.iconset -o recursos/LaRockola.icns

      - name: Instalador Linux
        if: runner.os == 'Linux'
        run: >
          jpackage --type deb --name larockola --app-version 1.0.0
          --input entrada --main-jar LaRockola.jar --main-class VentanaPrincipal
          --add-modules java.desktop --icon recursos/LaRockola.png
          --linux-shortcut --dest instalador

      - name: Instalador Windows
        if: runner.os == 'Windows'
        shell: bash
        run: >
          jpackage --type exe --name LaRockola --app-version 1.0.0
          --input entrada --main-jar LaRockola.jar --main-class VentanaPrincipal
          --add-modules java.desktop --icon recursos/LaRockola.ico
          --win-menu --win-shortcut --win-dir-chooser --dest instalador

      - name: Instalador Mac
        if: runner.os == 'macOS'
        run: >
          jpackage --type dmg --name LaRockola --app-version 1.0.0
          --input entrada --main-jar LaRockola.jar --main-class VentanaPrincipal
          --add-modules java.desktop --icon recursos/LaRockola.icns
          --dest instalador

      - name: Carpeta portable (sin instalar)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ICONO=recursos/LaRockola.ico
          elif [ "$RUNNER_OS" = "macOS" ]; then ICONO=recursos/LaRockola.icns
          else ICONO=recursos/LaRockola.png; fi
          jpackage --type app-image --name LaRockola --app-version 1.0.0 \
            --input entrada --main-jar LaRockola.jar --main-class VentanaPrincipal \
            --add-modules java.desktop --icon "$ICONO" --dest portable

      - uses: actions/upload-artifact@v4
        with:
          name: larockola-${{ matrix.os }}
          path: |
            instalador/*
            portable/*
